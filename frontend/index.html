<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123b35" />
    <meta name="description" content="Sistema de gestão de voluntários e escalas da igreja." />
    <title>Gestão de voluntários</title>
    <script>
      try {
        if (localStorage.getItem('voluntarios-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101a17')
        }
      } catch { /* O tema claro continua disponível quando o armazenamento está bloqueado. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
